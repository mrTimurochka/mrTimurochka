<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Timur Yesmagambetov — Full-stack Developer">
  <title>Timur Yesmagambetov — Full-stack Developer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0614"/>
      <stop offset="0.55" stop-color="#160a2b"/>
      <stop offset="1" stop-color="#241046"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5f3ff"/>
      <stop offset="0.45" stop-color="#ddd6fe"/>
      <stop offset="0.8" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1450" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#170b2d" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="cardStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c084fc" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#6d28d9" stop-opacity="0.25"/>
    </linearGradient>
    <radialGradient id="orbA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9333ea" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#9333ea" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c084fc" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4f46e5" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#a855f7" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.2"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1200" height="380" fill="url(#gridFade)"/></mask>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="380" rx="22"/></clipPath>
    <style>
      .float  { animation: float 6s ease-in-out infinite; }
      .floatB { animation: float 7.5s ease-in-out -2s infinite; }
      .drift  { animation: drift 14s ease-in-out infinite alternate; }
      .driftB { animation: drift 18s ease-in-out -6s infinite alternate-reverse; }
      .tw  { animation: tw 3.2s ease-in-out infinite; }
      .tw2 { animation: tw 4.1s ease-in-out -1.3s infinite; }
      .tw3 { animation: tw 2.6s ease-in-out -2.1s infinite; }
      .caret { animation: blink 1.1s steps(1) infinite; }
      .fade1 { animation: up 0.9s ease-out both; }
      .fade2 { animation: up 0.9s ease-out 0.25s both; }
      .fade3 { animation: up 0.9s ease-out 0.5s both; }
      .fade4 { animation: up 0.9s ease-out 0.75s both; }
      .scan  { animation: scan 5s linear infinite; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
      @keyframes drift { from { transform: translate(0,0); } to { transform: translate(60px,-25px); } }
      @keyframes tw { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
      @keyframes blink { 0%,50% { opacity: 1; } 50.01%,100% { opacity: 0; } }
      @keyframes up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes scan { from { transform: translateX(-420px); } to { transform: translateX(1400px); } }
      .sans { font-family: 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <!-- background -->
    <rect width="1200" height="380" fill="url(#bg)"/>
    <g class="drift"><circle cx="220" cy="80" r="260" fill="url(#orbA)"/></g>
    <g class="driftB"><circle cx="980" cy="330" r="280" fill="url(#orbC)"/></g>
    <g class="drift"><circle cx="880" cy="40" r="180" fill="url(#orbB)"/></g>
    <rect width="1200" height="380" fill="url(#grid)" mask="url(#gridMask)"/>

    <!-- stars -->
    <g fill="#e9d5ff">
      <circle class="tw"  cx="70"   cy="44"  r="1.6"/>
      <circle class="tw2" cx="160"  cy="300" r="1.3"/>
      <circle class="tw3" cx="420"  cy="38"  r="1.4"/>
      <circle class="tw"  cx="560"  cy="330" r="1.2"/>
      <circle class="tw2" cx="640"  cy="60"  r="1.8"/>
      <circle class="tw3" cx="1130" cy="60"  r="1.5"/>
      <circle class="tw"  cx="1160" cy="250" r="1.3"/>
      <circle class="tw2" cx="760"  cy="345" r="1.4"/>
      <circle class="tw3" cx="300"  cy="350" r="1.1"/>
      <circle class="tw"  cx="1040" cy="22"  r="1.2"/>
    </g>
    <g fill="#c084fc">
      <path class="tw2" d="M690 120l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
      <path class="tw"  d="M110 140l2.4 6.4 6.4 2.4-6.4 2.4-2.4 6.4-2.4-6.4-6.4-2.4 6.4-2.4z"/>
      <path class="tw3" d="M1100 160l2.4 6.4 6.4 2.4-6.4 2.4-2.4 6.4-2.4-6.4-6.4-2.4 6.4-2.4z"/>
    </g>

    <!-- light sweep -->
    <g class="scan" opacity="0.10"><rect x="0" y="-40" width="140" height="460" fill="#f5f3ff" transform="skewX(-18)"/></g>

    <!-- left text block -->

    <g>
      <text x="70" y="154" class="sans" font-size="56" font-weight="800" fill="url(#name)" filter="url(#glow)" letter-spacing="-1">Timur Yesmagambetov</text>
    </g>

    <g>
      <text x="72" y="198" class="mono" font-size="20" fill="#c4b5fd">
        <tspan fill="#a855f7">~/mrTimurochka</tspan><tspan fill="#ddd6fe"> $ </tspan><tspan fill="#f5f3ff">full-stack developer @ BAITC</tspan><tspan fill="#c084fc">▍<animate attributeName="fill-opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></tspan>
      </text>
      <rect x="72" y="220" width="430" height="2" fill="url(#line)"/>
    </g>

    <!-- tech pills -->
    <g class="mono" font-size="14" font-weight="600">
      <g transform="translate(72 242)">
        <rect width="86" height="32" rx="16" fill="#7c3aed" fill-opacity="0.22" stroke="#a855f7" stroke-opacity="0.6"/>
        <text x="43" y="21" text-anchor="middle" fill="#f5f3ff">NestJS</text>
      </g>
      <g transform="translate(168 242)">
        <rect width="54" height="32" rx="16" fill="#7c3aed" fill-opacity="0.22" stroke="#a855f7" stroke-opacity="0.6"/>
        <text x="27" y="21" text-anchor="middle" fill="#f5f3ff">Go</text>
      </g>
      <g transform="translate(232 242)">
        <rect width="78" height="32" rx="16" fill="#7c3aed" fill-opacity="0.22" stroke="#a855f7" stroke-opacity="0.6"/>
        <text x="39" y="21" text-anchor="middle" fill="#f5f3ff">React</text>
      </g>
      <g transform="translate(320 242)">
        <rect width="62" height="32" rx="16" fill="#7c3aed" fill-opacity="0.22" stroke="#a855f7" stroke-opacity="0.6"/>
        <text x="31" y="21" text-anchor="middle" fill="#f5f3ff">Vue</text>
      </g>
      <g transform="translate(392 242)">
        <rect width="94" height="32" rx="16" fill="#7c3aed" fill-opacity="0.22" stroke="#a855f7" stroke-opacity="0.6"/>
        <text x="47" y="21" text-anchor="middle" fill="#f5f3ff">GraphQL</text>
      </g>
      <g transform="translate(496 242)">
        <rect width="128" height="32" rx="16" fill="#7c3aed" fill-opacity="0.22" stroke="#a855f7" stroke-opacity="0.6"/>
        <text x="64" y="21" text-anchor="middle" fill="#f5f3ff">React Native</text>
      </g>
    </g>

    <!-- floating code card -->
    <g class="float">
      <g transform="translate(770 70)" filter="url(#soft)">
        <rect width="360" height="228" rx="18" fill="url(#card)" stroke="url(#cardStroke)" stroke-width="1.5"/>
        <rect width="360" height="40" rx="18" fill="#a855f7" fill-opacity="0.10"/>
        <rect y="22" width="360" height="18" fill="#a855f7" fill-opacity="0.10"/>
        <circle cx="24" cy="20" r="6" fill="#f472b6"/>
        <circle cx="44" cy="20" r="6" fill="#c084fc"/>
        <circle cx="64" cy="20" r="6" fill="#818cf8"/>
        <text x="180" y="25" text-anchor="middle" class="mono" font-size="12.5" fill="#c4b5fd" fill-opacity="0.85">timur.ts</text>

        <g class="mono" font-size="14.5">
          <text x="22" y="72"><tspan fill="#a78bfa">const</tspan><tspan fill="#f5f3ff"> timur </tspan><tspan fill="#c084fc">=</tspan><tspan fill="#f5f3ff"> {</tspan></text>
          <text x="44" y="98"><tspan fill="#ddd6fe">role</tspan><tspan fill="#a78bfa">: </tspan><tspan fill="#f0abfc">"full-stack"</tspan><tspan fill="#a78bfa">,</tspan></text>
          <text x="44" y="122"><tspan fill="#ddd6fe">years</tspan><tspan fill="#a78bfa">: </tspan><tspan fill="#fde68a">8</tspan><tspan fill="#a78bfa">,</tspan></text>
          <text x="44" y="146"><tspan fill="#ddd6fe">stack</tspan><tspan fill="#a78bfa">: [</tspan><tspan fill="#f0abfc">"TS"</tspan><tspan fill="#a78bfa">, </tspan><tspan fill="#f0abfc">"Go"</tspan><tspan fill="#a78bfa">, </tspan><tspan fill="#f0abfc">"Py"</tspan><tspan fill="#a78bfa">],</tspan></text>
          <text x="44" y="170"><tspan fill="#ddd6fe">now</tspan><tspan fill="#a78bfa">: </tspan><tspan fill="#f0abfc">"BAITC"</tspan><tspan fill="#a78bfa">,</tspan></text>
          <text x="44" y="194"><tspan fill="#ddd6fe">hireable</tspan><tspan fill="#a78bfa">: </tspan><tspan fill="#86efac">true</tspan></text>
          <text x="22" y="216"><tspan fill="#f5f3ff">};</tspan></text>
        </g>
      </g>
    </g>

    <!-- small floating badge -->
    <g class="floatB">
      <g transform="translate(636 292)" filter="url(#soft)">
        <rect width="150" height="58" rx="14" fill="#1b0d33" stroke="#c084fc" stroke-opacity="0.55"/>
        <text x="16" y="25" class="mono" font-size="11.5" fill="#c4b5fd">experience</text>
        <text x="16" y="46" class="sans" font-size="19" font-weight="800" fill="#f5f3ff">8+ years</text>
      </g>
    </g>

    <!-- bottom glow line -->
    <rect x="0" y="376" width="1200" height="4" fill="url(#line)"/>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="378.5" rx="21.5" fill="none" stroke="#a855f7" stroke-opacity="0.35" stroke-width="1.5"/>
</svg>
